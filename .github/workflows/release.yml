name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and Release
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify SemVer tag and tracked Info.plist
        id: get_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Invalid SemVer release tag: $RELEASE_TAG"
            exit 1
          fi
          SEMVER="${RELEASE_TAG#v}"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/Lunt/Info.plist)"
          if [[ "$PLIST_VERSION" != "$SEMVER" ]]; then
            echo "::error::Info.plist version $PLIST_VERSION does not match tag version $SEMVER"
            exit 1
          fi
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Sources/Lunt/Info.plist)"
          IS_PRERELEASE=false
          if [[ "$SEMVER" == *-* ]]; then
            IS_PRERELEASE=true
          fi
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "SEMVER=$SEMVER" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: |
          brew install swiftformat swiftlint
      - name: Install Sparkle Check
        run: |
          wget https://github.com/sparkle-project/Sparkle/releases/download/2.7.2/Sparkle-2.7.2.tar.xz
          mkdir -p sparkle-cli
          tar -xf Sparkle-2.7.2.tar.xz -C sparkle-cli
          echo "$(pwd)/sparkle-cli/bin" >> "$GITHUB_PATH"

      - name: Code Quality Check
        run: |
          make lint
          make format-check

      - name: Build DMG Packages
        run: |
          make VERSION="$SEMVER" dmg

      - name: Verify DMG File
        run: |
          set -euo pipefail
          ls -lh .build/*.dmg
          test -f ".build/Lunt-${{ env.SEMVER }}-arm64.dmg"
          test ! -e ".build/Lunt-${{ env.SEMVER }}-x86_64.dmg"
          test ! -e ".build/Lunt-${{ env.SEMVER }}-universal.dmg"
          hdiutil verify ".build/Lunt-${{ env.SEMVER }}-arm64.dmg"
          python3 ./Scripts/verify_release_artifacts.py --self-test
          python3 ./Scripts/verify_release_artifacts.py --dmg ".build/Lunt-${{ env.SEMVER }}-arm64.dmg" --tag "${{ env.VERSION }}"

      - name: Sign DMG with Sparkle
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          set -euo pipefail
          SIGN_UPDATE="sign_update"
          xattr -cr "${SIGN_UPDATE}" 2>/dev/null || true
          ARM_SIG=$("${SIGN_UPDATE}" ".build/Lunt-${{ env.SEMVER }}-arm64.dmg" --ed-key-file <(echo "$SPARKLE_ED_KEY"))
          echo "ARM_SIG=${ARM_SIG}" >> "$GITHUB_ENV"

      - name: Generate Appcast
        run: |
          PUB_DATE=$(date -R)
          
          cat > .build/appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Lunt Updates</title>
              <link>https://github.com/samzong/lunt</link>
              <description>Most recent changes with links to updates.</description>
              <language>en</language>
              
              <item>
                <title>Version ${{ env.SEMVER }}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${{ env.BUILD_NUMBER }}</sparkle:version>
                <sparkle:shortVersionString>${{ env.SEMVER }}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="https://github.com/samzong/lunt/releases/download/${{ env.VERSION }}/Lunt-${{ env.SEMVER }}-arm64.dmg"
                  type="application/octet-stream"
                  sparkle:os="macos"
                  ${ARM_SIG}
                />
              </item>
            </channel>
          </rss>
          EOF
          
          echo "===> Generated appcast.xml:"
          cat .build/appcast.xml
          xmllint --noout .build/appcast.xml
          test "$(grep -c '<enclosure' .build/appcast.xml)" -eq 1
          grep -Fq "Lunt-${{ env.SEMVER }}-arm64.dmg" .build/appcast.xml
          ! grep -Eq 'x86_64|universal' .build/appcast.xml
          python3 ./Scripts/verify_release_artifacts.py --appcast .build/appcast.xml --tag "${{ env.VERSION }}" --dmg ".build/Lunt-${{ env.SEMVER }}-arm64.dmg"

      - name: Generate Release Notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name='${{ env.VERSION }}' > generated_notes.json

          jq -er '.body | select(type == "string" and test("[^[:space:]]"))' generated_notes.json > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.get_version.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            .build/Lunt-${{ env.SEMVER }}-arm64.dmg
            .build/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
