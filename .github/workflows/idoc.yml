name: idoc
on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Create idoc config.
        run: |
          cat > idoc.yml << EOF
          site: Lunt
          description: A quiet macOS menubar hub for GitHub work. Menubar-first workflow, unified Issues/PRs list, saved searches, and more.
          keywords: macOS, GitHub, Lunt, Menubar, SwiftUI, Developer Tools
          favicon: Sources/Lunt/Resources/Assets.xcassets/AppIcon.appiconset/icon_256.png
          logo: Sources/Lunt/Resources/Assets.xcassets/AppIcon.appiconset/icon_256.png

          openSource: https://github.com/samzong/lunt

          tocs: false

          element:
            wrapper: style=max-width:720px;

          menus:
            Home: index.html
            About:
              url: https://github.com/samzong
              target: __blank
          cacheFileStat: true

          footer: |
            Copyright © {{idocYear}} <a href="https://github.com/samzong" target="_blank">samzong</a><br />
            <script>
              function downloadLatest() {
                window.location.href = 'https://github.com/samzong/lunt/releases/latest';
              }
            </script>
          EOF

      - run: npm install idoc@1 -g
      - run: idoc

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
